<body>

<style>
/* ===================== THEME =====================
   Swap this block (and the VIEW templates in the script) to apply an external UI guideline.
   Layout: single column, phone first; one focus card per exercise, sticky action bar at the bottom. */
:root{
  --bg:#eef0f3; --panel:#ffffff; --ink:#14171c; --soft:#5b6270; --line:#d9dde3; --field:#f7f8fa;
  --accent:#1d5bd0; --accent-ink:#ffffff; --good:#2b7a4b; --rest:#c9930a; --danger:#b3362f;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-sm:10px; --r-md:14px; --r-lg:22px; --tap:52px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1013; --panel:#171a1f; --ink:#eceef1; --soft:#9aa2ae; --line:#2a2f37; --field:#1f2329;
  --accent:#5c8ef0; --accent-ink:#0b1220; --good:#55b282; --rest:#e6b73a; --danger:#e0675f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1013; --panel:#171a1f; --ink:#eceef1; --soft:#9aa2ae; --line:#2a2f37; --field:#1f2329;
  --accent:#5c8ef0; --accent-ink:#0b1220; --good:#55b282; --rest:#e6b73a; --danger:#e0675f; color-scheme:dark}
/* ===================== /THEME ===================== */

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;min-height:100vh;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1.05}
h2{font-size:26px;line-height:1.1}
h3{font-size:21px;line-height:1.15}
.muted{color:var(--soft)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:8px 4px}

.btn{min-height:var(--tap);border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:17px;padding:0 22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.daycard{cursor:pointer;text-align:left;width:100%}
.daycard .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--soft)}
.daycard ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:15px}
.daycard li{display:flex;gap:10px}
.daycard li b{min-width:34px;font-family:var(--font-display);font-size:22px;color:var(--soft)}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:var(--r-lg);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;border:0;width:100%;text-align:left}
.note{font-size:13px;color:var(--soft);text-align:center;padding-bottom:8px}

/* exercise blocks */
.ex{display:flex;flex-direction:column;gap:10px}
.exhead{display:flex;align-items:flex-start;gap:12px}
.badge{flex:none;min-width:52px;height:52px;padding:0 10px;border-radius:14px;background:var(--field);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-display);font-size:26px;font-weight:700}
.exhead .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--field);border:1px solid var(--line);color:var(--soft);white-space:nowrap}
.chip.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.ss{border:2px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
.ss .sshead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:4px 0}

/* set grid, after the reference screenshot: Set | Reps | Weight (kg) */
.sets{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) minmax(44px,auto);gap:8px;align-items:center}
.sets .h{font-weight:700;font-size:14px;white-space:nowrap}
.sets .s{font-size:20px;color:var(--soft);font-variant-numeric:tabular-nums;padding-left:4px}
.sets input{width:100%;height:56px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:500 20px var(--font-body);padding:0 12px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.sets input:focus{border-color:var(--accent);outline:none;background:var(--panel)}
.sets .st{font-size:12.5px;color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}
.sets .st.done{color:var(--good);font-weight:700}
.sets .on input{border-color:var(--accent)}
.sets .act{grid-column:1/-1;height:0}
.sets .cur{color:var(--accent);font-weight:700}

/* focus view */
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.video{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#000;display:flex;justify-content:center;height:min(52vh,480px);max-width:100%}
.video.sm{height:min(34vh,300px)}
.video.max{position:fixed;inset:0;z-index:40;height:100vh;height:100dvh;border-radius:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.video.max iframe{width:100%;aspect-ratio:auto}
.vfs{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.vfs svg{width:20px;height:20px}.vfs .x,.video.max .vfs .e{display:none}.video.max .vfs .x{display:block}
.video.max .vfs{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto;right:calc(12px + env(safe-area-inset-right,0px))}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.vurl{font-size:13.5px;font-weight:600;white-space:nowrap;flex:none}
.video iframe{border:0;height:100%;width:100%;max-width:100%}
.video.short iframe{width:auto;aspect-ratio:9/16}
.vlink{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-lg);background:var(--ink);color:var(--bg);text-decoration:none;min-height:88px}
.vlink .play{width:52px;height:52px;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;flex:none}
.vlink .play svg{width:22px;height:22px;margin-left:3px}
.vlink b{display:block;font-size:17px}
.vlink span{font-size:13px;opacity:.75}
.vsub{font-size:13px;text-align:right}
.rounds{display:flex;gap:6px;flex-wrap:wrap}
.rounds .chip.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rounds .chip.ok{color:var(--good)}
.tempo{font-size:13px;color:var(--soft)}

.dock{position:sticky;bottom:0;margin:auto calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;z-index:5}
.dock .next{font-size:13.5px;color:var(--soft);text-align:center}

.timer{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--rest);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 30px var(--font-display);font-variant-numeric:tabular-nums}
.timer .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.timer .row .btn{min-height:44px;font-size:15px;flex:1 1 80px}
.hold{display:flex;align-items:center;gap:16px;padding:12px;border-radius:var(--r-md);background:var(--field);border:1px solid var(--line)}
.hold .ring{width:88px;height:88px}.hold .ring .fg{stroke:var(--accent)}
.hold .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.hold .row .btn{min-height:44px;font-size:15px;flex:1 1 70px}
/* one-line set entry: set pills, reps, kg */
.card.tight{padding:14px;gap:8px}
.line1{display:flex;align-items:center;gap:8px}
.pills{display:flex;gap:4px;flex:none}
.pill{width:34px;height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);font:700 17px var(--font-display);color:var(--soft);cursor:pointer;display:grid;place-items:center;padding:0}
.pill.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.pill.now{color:var(--accent);border-color:var(--accent)}
.pill.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.line1 label{flex:1;min-width:0;position:relative}
.line1 input{width:100%;height:48px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:500 19px var(--font-body);padding:0 36px 0 10px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.line1 label span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--soft);pointer-events:none}
.line1 input:focus{border-color:var(--accent);outline:none;background:var(--panel)}
.line1.on input{border-color:var(--accent)}
.ssitem.cur{border:2px solid var(--accent)}
.ssitem .exhead{align-items:center}
.okmark{color:var(--good)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--soft);min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.confirm{border:1.5px solid var(--danger)}

/* summary */
.sumtext{width:100%;min-height:220px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--field);color:var(--ink);font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--field);border-radius:var(--r-md);padding:10px 12px}
.stat b{display:block;font:700 26px var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--soft)}
.slist{display:flex;flex-direction:column;gap:10px}
.sitem{display:flex;flex-direction:column;gap:2px}
.sitem .l{font-size:14px;color:var(--soft);font-variant-numeric:tabular-nums}
.hist{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.ref{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.ref b{color:var(--ink);font-weight:600}
.topright{display:flex;align-items:center;gap:6px}
.fab{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--danger);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;z-index:15}
.fab{touch-action:none;user-select:none;-webkit-user-select:none;transition:left .2s,right .2s,top .2s}
.fab.drag{transition:none;transform:scale(1.12);box-shadow:0 8px 24px rgba(0,0,0,.28)}
.fab svg{width:22px;height:22px;pointer-events:none}
.fab .n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font:700 11px/20px var(--font-body);text-align:center;padding:0 5px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--panel);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.sheet textarea,.field{width:100%;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:16px/1.4 var(--font-body);padding:12px}
.sheet textarea{min-height:120px;resize:vertical}
.ctx{font-size:12.5px;color:var(--soft);background:var(--field);border-radius:var(--r-sm);padding:8px 10px}
.fbitem{display:flex;flex-direction:column;gap:4px;padding-block:10px;border-top:1px solid var(--line)}
.fbitem:first-of-type{border-top:0}
.fbitem.fixed{opacity:.55}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--soft)}
.sync{font-size:13px;color:var(--soft)}
.sync.bad{color:var(--danger)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notecard{gap:10px}
.nhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.st-open{color:var(--soft)}
.st-approved{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.st-fixed{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.st-done,.st-wontfix{color:var(--soft)}
.ntext{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.thread{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--line);padding-left:10px}
.thread .by{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.thread .claude .by{color:var(--accent)}
.nactions{display:flex;gap:8px;flex-wrap:wrap}
.nactions .btn{min-height:42px;font-size:15px;padding:0 16px}
textarea.field{min-height:96px;resize:vertical}
.callout{background:color-mix(in srgb,var(--accent) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:var(--r-md);padding:12px 14px;font-size:14.5px}
@media (max-width:360px){.card{padding:14px}.sets input{font-size:18px;padding:0 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<button id="fab" class="fab" data-act="fbopen" aria-label="Leave a note for Claude"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l1.9 1.9M16 2l-1.9 1.9M9 7.1V6a3 3 0 0 1 6 0v1.1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6zM12 20v-9M6.5 9C4.6 8.8 3 7.2 3 5M6 13H2M3 21c0-2.1 1.7-3.9 3.8-4M20.9 5c0 2.1-1.6 3.8-3.5 4M22 13h-4M17.2 17c2.1.1 3.8 1.9 3.8 4"/></svg><span class="n" id="fabn" hidden></span></button>
<div id="sheet" hidden></div>

<script>
/* ===================== PROGRAM =====================
   From "lower sk.xlsx". Same number with letters (6A, 6B) = superset.
   tempo "311" = 3s lowering, 1s pause, 1s lifting. hold = seconds for timed holds. */
var PROGRAM = {
  d1: { label: 'Day 1', name: 'Lower 1', items: [
    { no:'1',  id:'goblet-squat',   name:'DB Goblet Squat',              reps:'8',      sets:3, tempo:'311',   rest:60,  url:'https://youtube.com/shorts/K2TumOeks2A' },
    { no:'2',  id:'db-rdl',         name:'DB Romanian Deadlift',         reps:'8',      sets:3, tempo:'311',   rest:60,  url:'https://youtube.com/shorts/CBOhr6H7BEY' },
    { no:'3',  id:'cossack-squat',  name:'Cossack Squat',                reps:'8',      sets:3, tempo:'311',   rest:60,  url:'https://youtube.com/shorts/XvJ8gtW30ZA' },
    { no:'4',  id:'sl-smith-calf',  name:'Single-Leg Smith Calf Raise',  reps:'10',     sets:2, tempo:'311',   rest:60,  url:'https://youtube.com/shorts/GoNhkc7ZVVc' },
    { no:'5',  id:'sl-glute-bridge',name:'Single-Leg Glute Bridge',      reps:'10',     sets:2, tempo:'',      rest:60,  url:'https://youtube.com/shorts/RNMIy5Q5XBY' },
    { no:'6A', id:'copenhagen-plank',name:'Copenhagen Plank',            reps:'30 sec', sets:2, tempo:'ISO',   rest:120, url:'https://youtube.com/shorts/Ua7YHHOWRlA', hold:30 },
    { no:'6B', id:'farmers-carry',  name:'Farmers Carry',                reps:'8',      sets:2, tempo:'CONTR.',rest:120, url:'https://youtube.com/shorts/Ozp9nI_w4xo' }
  ]},
  d2: { label: 'Day 2', name: 'Lower 2', items: [
    { no:'1',  id:'sl-hip-thrust',  name:'DB Single-Leg Hip Thrust',     reps:'8',      sets:3, tempo:'311',   rest:60,  url:'https://youtube.com/shorts/bRZeB6UG6Js' },
    { no:'2',  id:'split-squat',    name:'DB Split Squat',               reps:'8',      sets:3, tempo:'311',   rest:60,  url:'https://youtube.com/shorts/sw4MzpC8l58' },
    { no:'3',  id:'ham-curl',       name:'Machine Hamstring Curl',       reps:'8',      sets:3, tempo:'311',   rest:60,  url:'https://youtube.com/shorts/kYx9uchpwVo' },
    { no:'4',  id:'sl-seated-calf', name:'Single-Leg Seated Calf Raise', reps:'10',     sets:2, tempo:'311',   rest:60,  url:'https://youtube.com/shorts/0T0LtUAqPmU' },
    { no:'5A', id:'sl-elev-plank',  name:'Single-Leg Elevated Plank',    reps:'30 sec', sets:2, tempo:'',      rest:120, url:'https://youtube.com/shorts/QfU2iZFeN-M', hold:30 },
    { no:'5B', id:'wall-leg-lower', name:'Wall Press Leg Lower',         reps:'8 each', sets:2, tempo:'ISO',   rest:120, url:'https://youtu.be/XsdtPDgfRM4' },

  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  expand: '<svg class="e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  close: '<svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};
function topBar(title, backAct, right){
  var left = !backAct ? '<span></span>' : backAct === 'home'
    ? '<button class="iconbtn" data-act="home" aria-label="Home">' + ICON.home + '</button>'
    : '<span class="topright"><button class="iconbtn" data-act="' + backAct + '" aria-label="Back">' + ICON.back + '</button><button class="iconbtn" data-act="home" aria-label="Home">' + ICON.home + '</button></span>';
  return '<div class="top">' + left +
    '<div style="flex:1;min-width:0;text-align:center"><h3>' + esc(title) + '</h3></div>' + (right || '<span style="width:44px"></span>') + '</div>';
}
function chips(it, withRest){
  var c = '<span class="chip accent">' + esc(it.reps) + (numeric(it.reps) ? ' reps' : '') + '</span><span class="chip">' + it.sets + ' sets</span>';
  if (it.tempo) c += '<span class="chip">' + esc(tempoText(it.tempo) || it.tempo) + '</span>';
  if (withRest) c += '<span class="chip">' + (it.rest / 60) + ' min rest</span>';
  return '<div class="chips">' + c + '</div>';
}
function setGrid(rows){
  // rows: [{i, reps, kg, scope, ex, status, statusDone, on}]
  var h = '<div class="sets"><span class="h">Set</span><span class="h">Reps</span><span class="h">Weight (kg)</span><span></span>';
  rows.forEach(function(r){
    var on = r.on ? ' on' : '';
    h += '<span class="s' + (r.on ? ' cur' : '') + '">' + (r.i + 1) + '</span>' +
      '<span class="' + on + '"><input id="' + r.scope + '-' + r.ex + '-' + r.i + '-reps" data-in="' + r.scope + '" data-ex="' + r.ex + '" data-i="' + r.i + '" data-f="reps" value="' + esc(r.reps) + '" inputmode="' + (numeric(r.reps) || r.reps === '' ? 'numeric' : 'text') + '" aria-label="Set ' + (r.i + 1) + ' reps"></span>' +
      '<span class="' + on + '"><input id="' + r.scope + '-' + r.ex + '-' + r.i + '-kg" data-in="' + r.scope + '" data-ex="' + r.ex + '" data-i="' + r.i + '" data-f="kg" value="' + esc(r.kg) + '" inputmode="decimal" placeholder="kg" aria-label="Set ' + (r.i + 1) + ' weight in kg"></span>' +
      '<span class="st' + (r.statusDone ? ' done' : '') + '">' + (r.status || '') + '</span>';
  });
  return h + '</div>';
}
function videoBlock(it, cls){
  if (!it.url) return '';
  if (IN_ARTIFACT) return '<a class="vlink" href="' + esc(it.url) + '" target="_blank" rel="noopener"><span class="play">' + ICON.play + '</span><span><b>Watch reference</b><span>' + esc(it.name) + ' on YouTube</span></span></a>';
  return '<div class="video' + (isShort(it.url) ? ' short' : '') + (cls ? ' ' + cls : '') + '"><iframe src="https://www.youtube-nocookie.com/embed/' + ytId(it.url) + '?playsinline=1&rel=0&modestbranding=1&fs=1" title="' + esc(it.name) + ' reference video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>' +
    '<button class="vfs" data-act="vfull" aria-label="Full screen video">' + ICON.expand + ICON.close + '</button></div>';
}
function vurl(it){ return it.url ? '<a class="vurl" href="' + esc(it.url) + '" target="_blank" rel="noopener">Video URL</a>' : ''; }
function fmtSec(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + pad(s % 60); }
function holdTotal(it){ return FAST ? 3 : it.hold; }
function holdLeft(it){
  if (!W.hold) return holdTotal(it);
  if (W.hold.until) return Math.max(0, (W.hold.until - Date.now()) / 1000);
  return W.hold.left;
}
// live countdown ring for timed holds: Start, Pause, Resume, Reset
function holdBlock(it){
  var total = holdTotal(it), left = holdLeft(it), run = W.hold && W.hold.until;
  var btn = run ? '<button class="btn primary" data-act="holdpause">Pause</button>'
    : left <= 0 ? '<button class="btn" data-act="hold">Again</button>'
    : '<button class="btn primary" data-act="hold">' + (left < total ? 'Resume' : 'Start ' + total + 's') + '</button>';
  return '<div class="hold"><div class="ring"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="44"/><circle id="hring" class="fg" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="' + (276.5 * (1 - left / total)).toFixed(1) + '"/></svg><b id="htime">' + fmtSec(left) + '</b></div>' +
    '<div class="info"><div class="eyebrow">' + (left <= 0 ? 'Hold done' : run ? 'Holding' : 'Hold timer') + '</div><div class="row">' + btn +
    (W.hold ? '<button class="btn" data-act="holdreset">Reset</button>' : '') + '</div></div></div>';
}
// one line per exercise: set pills (tap to pick a set), reps, kg
function entryLine(x, r, act){
  var sets = W.sets[x.id], cur = Math.min(r, sets.length - 1);
  var sel = S.sel && S.sel.ex === x.id && sets[S.sel.i] ? S.sel.i : cur, s = sets[sel];
  var pills = sets.map(function(y, i){
    return '<button class="pill' + (y.at ? ' ok' : '') + (i === cur && act ? ' now' : '') + (i === sel ? ' sel' : '') + '" data-act="selset" data-ex="' + x.id + '" data-i="' + i + '" aria-label="Set ' + (i + 1) + (y.at ? ', done' : '') + '">' + (y.at ? '✓' : i + 1) + '</button>';
  }).join('');
  var inp = function(f, mode, unit, ph){
    return '<label><input id="w-' + x.id + '-' + sel + '-' + f + '" data-in="w" data-ex="' + x.id + '" data-i="' + sel + '" data-f="' + f + '" value="' + esc(s[f]) + '" inputmode="' + mode + '" placeholder="' + ph + '" aria-label="Set ' + (sel + 1) + (f === 'kg' ? ' weight in kg' : ' reps') + '">' + (unit ? '<span>' + unit + '</span>' : '') + '</label>';
  };
  var status = 'Set ' + (sel + 1) + ' of ' + sets.length + (s.at ? ', done at ' + fmtTime(s.at) : sel === cur && act ? ', now' : '');
  return '<div class="line1' + (act && sel === cur ? ' on' : '') + '"><div class="pills">' + pills + '</div>' +
    inp('reps', numeric(s.reps) || s.reps === '' ? 'numeric' : 'text', numeric(s.reps) ? 'reps' : '', 'reps') + inp('kg', 'decimal', 'kg', 'BW') + '</div>' +
    '<div class="ref">' + status + '</div>' + lastLine(x.id);
}

function viewHome(){
  var h = '<div class="top"><div><div class="eyebrow">Strength</div><h1>Lower Body Log</h1></div><div class="topright">' + refreshBtn() + '</div></div>' +
    '<div class="row" style="gap:4px;margin-top:-10px"><button class="link" data-act="history">History</button><button class="link" data-act="notes">Notes' + (notesBadge() ? ' (' + notesBadge() + ')' : '') + '</button><button class="link" data-act="settings">Settings</button></div>';
  if (W){
    var it = exById(stepsOf()[W.cur].ex);
    h += '<button class="banner" data-act="resume"><span><span class="eyebrow" style="color:inherit;opacity:.8">' + PROGRAM[W.day].name + ' in progress</span><br><b>' + esc(it.no + '. ' + it.name) + '</b></span><b>Resume</b></button>';
  }
  ['d1', 'd2'].forEach(function(dk){
    var p = PROGRAM[dk], last = hist().filter(function(x){ return x.day === dk; })[0];
    h += '<button class="card daycard" data-act="day" data-day="' + dk + '"><div><div class="eyebrow">' + p.label + '</div><h2>' + p.name + '</h2></div>' +
      '<div class="meta"><span>' + p.items.length + ' exercises</span><span>about ' + estMinutes(dk) + ' min</span><span>' + (last ? 'Last done ' + fmtDate(last.started) : 'Not done yet') + '</span></div>' +
      '<ol>' + p.items.map(function(it){ return '<li><b>' + it.no + '</b><span>' + esc(it.name) + '</span></li>'; }).join('') + '</ol></button>';
  });
  h += '<div class="note" id="syncnote">' + esc(syncText()) + '</div>';
  return h;
}

function viewDay(){
  var dk = S.day, p = PROGRAM[dk], busy = W && W.day === dk, ed = S.progEdit && !busy;
  var h = topBar(p.name, 'home', busy ? null : '<button class="link" data-act="progedit" style="min-width:44px">' + (ed ? 'Done' : 'Edit') + '</button>');
  h += '<div class="muted" style="text-align:center;margin-top:-8px">' + p.label + ' · ' + p.items.length + ' exercises · about ' + estMinutes(dk) + ' min</div>';
  if (ed) h += '<div class="callout">Add, edit or delete exercises and sets. Changes apply to your next workouts; past workouts keep what you did.</div>';
  if (!p.items.length) h += '<div class="card"><span class="muted">No exercises in this day. Tap Edit, then Add exercise.</span></div>';
  blocks(dk).forEach(function(b){
    var inner = b.items.map(function(it, k){
      var head = '<div class="exhead"><span class="badge">' + it.no + '</span><div class="t"><h3>' + esc(it.name) + '</h3>' + chips(it, !b.superset);
      if (ed){
        var id = esc(it.id);
        return (k ? '<div class="divider"></div>' : '') + '<div class="ex">' + head + '</div></div>' + (S.exdel === it.id
          ? '<div class="nactions"><span class="muted" style="align-self:center">Delete this exercise?</span><button class="btn danger" data-act="exdelyes" data-id="' + id + '">Delete</button><button class="btn" data-act="exdelno">Keep</button></div>'
          : '<div class="nactions"><button class="btn" data-act="exedit" data-id="' + id + '">Edit</button><button class="btn" data-act="setminus" data-id="' + id + '" aria-label="Remove a set"' + (it.sets <= 1 ? ' disabled' : '') + '>− Set</button><button class="btn" data-act="setplus" data-id="' + id + '" aria-label="Add a set">+ Set</button><button class="link" data-act="exdel" data-id="' + id + '" style="color:var(--danger)">Delete</button></div>') + '</div>';
      }
      var rows = []; for (var i = 0; i < it.sets; i++) rows.push({ i: i, scope: 'plan', ex: it.id, reps: planVal(dk, it.id, i, 'reps'), kg: planVal(dk, it.id, i, 'kg') });
      return (k ? '<div class="divider"></div>' : '') + '<div class="ex">' + head +
        (it.url ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener" style="font-size:14px;font-weight:600">Watch reference</a>' : '') + '</div></div>' + setGrid(rows) + lastLine(it.id) + '</div>';
    }).join('');
    if (b.superset) h += '<section class="card ss"><div class="sshead"><span class="eyebrow">Superset ' + b.n + '</span><span class="chip">' + b.sets + ' rounds · ' + (SUPERSET_REST / 60) + ' min rest after each round</span></div>' + inner + '</section>';
    else h += '<section class="card">' + inner + '</section>';
  });
  if (ed){
    h += '<button class="btn block" data-act="exadd">+ Add exercise</button>';
    if (PROG && PROG.days) h += S.progReset
      ? '<div class="card confirm"><b>Go back to the original program?</b><span class="muted">Both days return to the exercises from your spreadsheet. Past workouts are not touched.</span><div class="row"><button class="btn danger" data-act="progresetyes">Reset program</button><button class="btn" data-act="progresetno">Cancel</button></div></div>'
      : '<button class="link" data-act="progreset" style="color:var(--danger);align-self:center">Reset to the original program</button>';
    return h + '<div class="dock"><button class="btn primary block" data-act="progedit">Done editing</button></div>';
  }
  h += '<div class="dock">' + (W && W.day !== dk ? '<div class="next">Starting this ends your ' + PROGRAM[W.day].name + ' workout in progress.</div>' : '') +
    (busy ? '<button class="btn primary block" data-act="resume">Resume workout</button>' : '<button class="btn primary block" data-act="start"' + (p.items.length ? '' : ' disabled') + '>Start workout</button>') + '</div>';
  return h;
}

function viewExEdit(){
  var f = S.exf, d = f.draft;
  var fld = function(id, label, val, attrs){ return '<label class="fl"><span>' + label + '</span><input id="xf-' + id + '" class="field" value="' + esc(val == null ? '' : val) + '"' + (attrs || '') + '></label>'; };
  var h = topBar(f.id ? 'Edit exercise' : 'Add exercise', 'backday');
  h += '<div class="muted" style="text-align:center;margin-top:-8px">' + esc(PROGRAM[f.dk].name) + '</div>';
  h += '<section class="card">' +
    '<div class="two">' + fld('no', 'Number', d.no, ' autocapitalize="characters" placeholder="3 or 5A"') + fld('sets', 'Sets', d.sets, ' inputmode="numeric"') + '</div>' +
    fld('name', 'Name', d.name, ' placeholder="e.g. Bulgarian Split Squat"') +
    '<div class="two">' + fld('reps', 'Reps', d.reps, ' placeholder="8, 30 sec, 15 m"') + fld('tempo', 'Tempo', d.tempo, ' autocapitalize="characters" placeholder="311, ISO"') + '</div>' +
    '<div class="two">' + fld('rest', 'Rest (seconds)', d.rest, ' inputmode="numeric"') + fld('hold', 'Hold timer (seconds)', d.hold, ' inputmode="numeric" placeholder="None"') + '</div>' +
    fld('url', 'Video URL (YouTube)', d.url, ' inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://youtube.com/shorts/…"') +
    '<span class="ref">The same number with a letter (5A, 5B, 5C) makes a superset: done back to back, then ' + (SUPERSET_REST / 60) + ' min rest.</span>' +
    '<div class="row"><button class="btn primary" data-act="exsave">Save</button><button class="btn" data-act="backday">Cancel</button></div></section>';
  return h;
}

function viewFocus(){
  var steps = stepsOf(), st = steps[W.cur], bl = blocks(W.day), b = bl[st.b], it = exById(st.ex);
  var doneCount = steps.filter(function(s){ return W.sets[s.ex][s.set].at; }).length, live = !W.rest && !W.blockDone;
  var h = topBar(PROGRAM[W.day].name, 'home', '<button class="link" data-act="end" style="color:var(--danger)">End</button>');
  h += '<div class="progress" aria-label="Workout progress"><i style="width:' + Math.round(doneCount / steps.length * 100) + '%"></i></div>';
  if (S.confirm){
    h += '<div class="card confirm"><b>Finish this workout now?</b><span class="muted">Sets you have marked done go into the summary.</span><div class="row">' +
      '<button class="btn primary" data-act="finish">Finish and see summary</button><button class="btn" data-act="keep">Keep going</button></div>' +
      '<button class="link" data-act="discard" style="color:var(--danger);align-self:flex-start">It was a trial, move it to the archive</button></div>';
  }
  if (b.superset){
    // the whole superset on one page, one card per exercise, the current one outlined
    h += '<div class="exrow"><span class="eyebrow">Exercise ' + (st.b + 1) + ' of ' + bl.length + ' · Superset ' + b.n + ' · Round ' + (st.set + 1) + ' of ' + b.sets + '</span></div>';
    b.items.forEach(function(x){
      if (st.set >= x.sets) return;
      var act = live && x.id === it.id, ok = W.sets[x.id][st.set] && W.sets[x.id][st.set].at;
      h += '<section class="card tight ssitem' + (act ? ' cur' : '') + '"><div class="exhead"><span class="badge">' + x.no + '</span><div class="t"><h3>' + esc(x.name) + (ok ? ' <span class="okmark">✓</span>' : '') + '</h3>' + chips(x, false) + '</div>' + vurl(x) + '</div>' +
        videoBlock(x, 'sm') + (x.hold && act ? holdBlock(x) : '') + entryLine(x, st.set, act) + '</section>';
    });
  } else {
    h += '<div class="exrow"><span class="eyebrow">Exercise ' + (st.b + 1) + ' of ' + bl.length + '</span>' + vurl(it) + '</div>';
    h += videoBlock(it);
    h += '<div class="exhead"><span class="badge">' + it.no + '</span><div class="t"><h2>' + esc(it.name) + '</h2>' + chips(it, false) + '</div></div>';
    if (it.hold && live) h += holdBlock(it);
    h += '<div class="card tight">' + entryLine(it, W.blockDone ? it.sets - 1 : st.set, live) + '</div>';
  }

  h += '<div class="row" style="justify-content:space-between">' + (st.b > 0 ? '<button class="link" data-act="prevex">Previous exercise</button>' : '<span></span>') +
    (st.b < bl.length - 1 ? '<button class="link" data-act="skipex">Skip to next exercise</button>' : '') + '</div>';

  // action dock
  var dock = '';
  if (W.rest){
    var next = steps[W.cur + 1], nit = exById(next.ex);
    dock += '<div class="timer"><div class="ring"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="44"/><circle id="rring" class="fg" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><b id="rtime">0:00</b></div>' +
      '<div class="info"><div><div class="eyebrow">Rest</div><div><b>Next:</b> ' + (b.superset ? 'Round ' + (next.set + 1) + ', ' : 'Set ' + (next.set + 1) + ', ') + esc(nit.no + ' ' + nit.name) + '</div></div>' +
      '<div class="row"><button class="btn" data-act="plus30">+30s</button><button class="btn" data-act="skiprest">Skip</button></div></div></div>';
  } else if (W.blockDone){
    var nb = bl[st.b + 1];
    dock += nb ? '<div class="next">All sets done. Up next: ' + esc(nb.items.map(function(x){ return x.no + ' ' + x.name; }).join(' + ')) + '</div><button class="btn good block" data-act="nextex">Next exercise</button>'
      : '<div class="next">That was the last exercise.</div><button class="btn good block" data-act="finish">Finish workout</button>';
  } else {
    var after = steps[W.cur + 1], label = 'Done set ' + (st.set + 1);
    if (b.superset && !st.rest && !st.end) label = 'Done, go to ' + exById(after.ex).no;
    else if (st.rest) label += ' · start ' + (st.rest >= 60 ? (st.rest / 60) + ' min' : st.rest + 's') + ' rest';
    dock += '<button class="btn primary block" data-act="done">' + label + '</button>';
  }
  h += '<div class="dock">' + dock + '</div>';
  return h;
}

function viewSummary(){
  var rec = S.rec, p = PROGRAM[rec.day], fromHist = S.fromHist;
  var h = topBar(fromHist ? p.name : 'Workout done', fromHist ? 'history' : 'home');
  h += '<div class="muted" style="text-align:center;margin-top:-8px">' + fmtDate(rec.started) + ' · ' + fmtTime(rec.started) + ' to ' + fmtTime(rec.ended) + '</div>';
  if (!Object.keys(rec.sets).length) return h + '<div class="card">No sets were marked done, so nothing was saved.</div><button class="btn block" data-act="home">Back to start</button>';
  h += '<div class="stats"><div class="stat"><b>' + mins(rec) + '</b><span>minutes</span></div><div class="stat"><b>' + setCount(rec) + '</b><span>sets</span></div><div class="stat"><b>' + volume(rec).toLocaleString() + '</b><span>kg volume</span></div></div>';
  if (S.saved) h += '<div class="note" style="text-align:left">' + esc(S.saved) + '</div>';
  h += '<div class="card"><div><h3>For Strava</h3><span class="muted" style="font-size:14px">Create a Weight Training activity with the start time and duration above, then paste this into its description.</span></div>' +
    '<textarea id="sumtext" class="sumtext" readonly>' + esc(stravaText(rec)) + '</textarea>' +
    '<div class="row"><button class="btn primary" data-act="copy">Copy for Strava</button>' + (DL || !IN_ARTIFACT ? '<button class="btn" data-act="csv">Download CSV</button>' : '') + '</div></div>';
  var doneIt = recItems(rec);
  if (S.editing){
    h += '<div class="card"><div><h3>Edit weights</h3><span class="muted" style="font-size:14px">' + esc(PROGRAM[rec.day].label + ', ' + fmtDate(rec.started)) + '</span></div>' + doneIt.map(function(it){
      return '<div class="ex"><b>' + it.no + '. ' + esc(it.name) + '</b>' + setGrid(rec.sets[it.id].map(function(x, i){ return { i: i, scope: 'h', ex: it.id, reps: x.reps, kg: x.kg, status: fmtTime(x.at) }; })) + '</div>';
    }).join('<div class="divider"></div>') + '<div class="row"><button class="btn primary" data-act="editsave">Save changes</button><button class="btn" data-act="editcancel">Cancel</button></div></div>';
  } else {
    h += '<div class="card slist">' + doneIt.map(function(it){
      return '<div class="sitem"><b>' + it.no + '. ' + esc(it.name) + '</b>' + rec.sets[it.id].map(function(x, i){ return '<span class="l">' + esc(setLine(x, i)) + '</span>'; }).join('') + '</div>';
    }).join('') + '<button class="btn" data-act="edit" style="align-self:flex-start">Edit weights</button></div>';
  }
  if (fromHist && rec.archived){
    h += '<div class="callout">This workout is in the archive. It stays in your backup but is hidden from History and from your last-time weights.</div>' +
      '<button class="btn" data-act="unarchive">Restore to history</button>';
  } else if (fromHist){
    h += S.confirmDel ? '<div class="card confirm"><b>Move this workout to the archive?</b><span class="muted">It disappears from History and from your last-time weights, but stays in your backup. You can restore it from the archive.</span><div class="row"><button class="btn danger" data-act="delrec">Move to archive</button><button class="btn" data-act="nodel">Keep it</button></div></div>'
      : '<button class="link" data-act="askdel" style="color:var(--danger);align-self:center">Move to archive</button>';
  } else h += '<button class="btn block" data-act="home" style="margin-bottom:16px">Done</button>';
  return h;
}

function histRow(rec){
  return '<button class="card hist" data-act="open" data-id="' + rec.id + '"><span><b>' + PROGRAM[rec.day].name + '</b> <span class="muted">' + PROGRAM[rec.day].label + (rec.trial ? ' · trial' : '') + '</span><br><span class="muted" style="font-size:14px">' + fmtDate(rec.started) + ' · ' + fmtTime(rec.started) + '</span></span>' +
    '<span class="muted num" style="font-size:14px;text-align:right">' + setCount(rec) + ' sets<br>' + volume(rec).toLocaleString() + ' kg</span></button>';
}
function viewHistory(){
  var h = topBar('History', 'home'), arch = archivedHist();

    case 'exdelyes': delEx(el.getAttribute('data-id')); S.exdel = null; render(); toast('Deleted. Past workouts keep it.'); break;
    case 'progreset': S.progReset = true; render(); break;
    case 'progresetno': S.progReset = false; render(); break;
    case 'progresetyes': resetProg(); S.progReset = false; render(); toast('Back to the original program'); break;
    case 'nextex': gotoBlock(stepsOf()[W.cur].b + 1); break;
    case 'skipex': gotoBlock(stepsOf()[W.cur].b + 1); break;
    case 'prevex': gotoBlock(stepsOf()[W.cur].b - 1); break;
    case 'end': S.confirm = true; render(); scrollTo(0, 0); break;
    case 'keep': S.confirm = false; render(); break;
    case 'finish': finishWorkout(); break;
    case 'discard': var kept = archiveWorkout(); go('home'); toast(kept ? 'Moved to the archive' : 'Workout discarded, no sets were done'); break;
    case 'togglearch': S.showArch = !S.showArch; render(); break;
    case 'unarchive': S.rec.archived = false; S.rec.updated = Date.now(); backend.put(S.rec).catch(function(){}); render(); toast('Restored to history'); break;
    case 'askfix': try { navigator.clipboard.writeText('fix feedback').then(function(){ toast('Copied "fix feedback"'); }, function(){}); } catch(err){} break;
    case 'open': S.rec = HIST.filter(function(h){ return h.id === el.getAttribute('data-id'); })[0]; S.fromHist = true; S.saved = ''; go('summary'); break;
    case 'askdel': S.confirmDel = true; render(); break;
    case 'nodel': S.confirmDel = false; render(); break;
    case 'delrec': S.rec.archived = true; S.rec.updated = Date.now(); backend.put(S.rec).catch(function(){}); go('history'); toast('Moved to the archive'); break;
    case 'copy':
      var txt = stravaText(S.rec), ta = $('sumtext');
      var fallback = function(){ ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length); toast('Text selected. Tap Copy.'); };
      try { navigator.clipboard.writeText(txt).then(function(){ toast('Copied. Paste it into your Strava activity.'); }, fallback); } catch(err){ fallback(); }
      break;
    case 'csv':
      var data = csv(S.rec), name = fileName(S.rec, 'csv');
      if (DL) DL.save({ filename: name, data: data }).then(function(){ toast('CSV saved'); }, function(err){ if (err && err.code !== 'declined') toast('Could not save the CSV here'); });
      else { var u = URL.createObjectURL(new Blob([data], { type: 'text/csv' })), lk = document.createElement('a'); lk.href = u; lk.download = name; document.body.appendChild(lk); lk.click(); lk.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 2000); }
      break;
  }
});
document.addEventListener('input', function(e){
  var el = e.target; if (!el.hasAttribute || !el.hasAttribute('data-in')) return;
  var ex = el.getAttribute('data-ex'), i = +el.getAttribute('data-i'), f = el.getAttribute('data-f'), v = el.value.trim().replace(',', '.');
  if (el.getAttribute('data-in') === 'plan'){
    PLAN[S.day] = PLAN[S.day] || {}; PLAN[S.day][ex] = PLAN[S.day][ex] || [];
    PLAN[S.day][ex][i] = PLAN[S.day][ex][i] || {}; PLAN[S.day][ex][i][f] = v; lsSet(KEY_PLAN, PLAN);
  } else if (el.getAttribute('data-in') === 'h'){ if (S.rec && S.editing) S.rec.sets[ex][i][f] = v; }
  else if (W){ W.sets[ex][i][f] = v; saveActive(); }
});

(function restoreView(){
  var r = null;
  try { r = JSON.parse(sessionStorage.getItem('lbl.return')); sessionStorage.removeItem('lbl.return'); } catch(e){}
  if (!r) return;
  S.day = r.day || S.day; S.nf = r.nf || null; S.fromHist = r.fromHist;
  if (r.view === 'summary'){ S.rec = HIST.filter(function(h){ return h.id === r.rec; })[0]; if (!S.rec) return; }
  if (r.view === 'focus' && !W) return;
  if (r.view === 'exedit') r.view = 'day';
  S.view = r.view || 'home';
  if (S.view === 'focus') wake();
})();
render();
gistPull();
['fullscreenchange', 'webkitfullscreenchange'].forEach(function(n){ document.addEventListener(n, function(){
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  var m = document.querySelector('.video.max'); if (m){ m.classList.remove('max'); document.body.style.overflow = ''; }
}); });
document.addEventListener('visibilitychange', function(){ if (!document.hidden && S.view !== 'focus' && S.view !== 'exedit' && Date.now() - SYNC.at > 60000) gistPull(); });
</script>
